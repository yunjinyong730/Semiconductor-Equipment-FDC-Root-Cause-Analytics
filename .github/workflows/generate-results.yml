name: Generate portfolio results

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_readme_figures.py"
      - ".github/workflows/generate-results.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SECOM analytics pipeline
        run: python run_pipeline.py

      - name: Generate README result figures
        run: python scripts/generate_readme_figures.py

      - name: Commit generated portfolio results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images docs/results
          if git diff --cached --quiet; then
            echo "No generated result changes"
          else
            git commit -m "Update SECOM analysis result figures"
            git pull --rebase origin main
            git push
          fi
